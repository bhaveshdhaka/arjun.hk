<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffe29a" />
  <title>My Progress — Flags of the World</title>
  <script>(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}document.documentElement.dataset.theme=t})();</script>
  <link rel="stylesheet" href="../assets/css/base.css?v=09072307" />
  <style>
    .empty { text-align: center; font-weight: 800; color: var(--text); padding: 1.4rem .9rem; line-height: 1.5; font-size: 1rem; }
    .bar { height: 1rem; border-radius: 999px; background: #ffffffaa; overflow: hidden; margin: .5rem 0 .3rem; box-shadow: inset 0 2px 6px #00000012; }
    .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--bar-grad-a), var(--bar-grad-b)); }
    .rg { display: flex; align-items: center; gap: .6rem; margin: .5rem 0; }
    .rg .nm { width: 5.6rem; font-weight: 800; font-size: .92rem; flex-shrink: 0; }
    .rg .bar { flex: 1; margin: 0; }
    .rg .pc { width: 2.8rem; text-align: right; font-weight: 900; font-size: .92rem; }
    .ranks { display: flex; gap: .5rem; flex-wrap: wrap; }
    .rank { display: inline-flex; align-items: center; gap: .35rem; font-weight: 800; font-size: .92rem; background: var(--card-soft); border-radius: 999px; padding: .42rem .9rem; box-shadow: 0 3px 0 var(--chip-shadow); }
    .weakgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
    @media (min-width: 701px) { .weakgrid { grid-template-columns: repeat(6, 1fr); } }
    .mini { background: var(--card); border-radius: 1rem; padding: .55rem; text-align: center; box-shadow: 0 3px 0 var(--answer-shadow), 0 5px 12px var(--shadow-deep); }
    .mini img { width: 100%; height: auto; border-radius: .35rem; box-shadow: 0 2px 6px #00000022; display: block; background: var(--flag-card); }
    .mini .nm { font-weight: 900; margin: .3rem 0 .05rem; font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini .acc { font-size: .72rem; font-weight: 900; color: var(--accent); }
    .hrow { display: flex; justify-content: space-between; gap: .6rem; background: var(--card); border-radius: 1rem; padding: .6rem .9rem; box-shadow: 0 3px 0 var(--answer-shadow), 0 5px 12px var(--shadow-deep); font-weight: 700; font-size: .9rem; flex-wrap: wrap; }
    .hrow .when { color: var(--text-faint); font-weight: 800; }
    .hrow .res { font-weight: 900; color: var(--accent); }
    .empty { text-align: center; font-weight: 800; color: var(--text); padding: 1.4rem .9rem; line-height: 1.5; font-size: 1rem; }
    .speak { margin-top: .35rem; border: none; background: var(--card-soft); color: var(--accent); border-radius: .6rem; padding: .2rem .5rem; font-size: .8rem; cursor: pointer; font-family: inherit; }
    .speak:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="chip" href="../">← Flags</a>
      <span class="chip"><span id="who"></span></span>
    </div>
    <h1 class="title" style="animation:none">My Progress 🚩</h1>
    <div class="sub" id="profileNote"></div>
    <div id="content"></div>
    <div class="actions" style="margin-bottom:1rem">
      <a class="btn" href="./?focus=Weak">🔁 Drill my weak flags</a>
    </div>
    <footer>the caterpillar believes in you 🐛</footer>
  </div>
  <script type="module">
    import { Store } from '../assets/js/store.js?v=09072307';
    import { cycleTheme } from '../assets/js/theme.js?v=09072307';
    import { makeSpeaker } from '../assets/js/pronunciation.js?v=09072307';
    import { stats, RANK_LABELS, GLOBE, WORLD_COUNT } from '../flags/js/build.js?v=09072307';
    import { REGIONS, COUNTRIES } from '../flags/js/data.js?v=09072307';

    const codeNames = Object.fromEntries(COUNTRIES.map((c) => [c.c, c.n]));
    const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }[c]));

    const speak = (() => {
      try {
        const synth = typeof speechSynthesis !== 'undefined' ? speechSynthesis : null;
        const Utterance = typeof SpeechSynthesisUtterance !== 'undefined' ? SpeechSynthesisUtterance : null;
        if (!speechSynthesis || typeof SpeechSynthesisUtterance !== 'function') return () => false;
        return (text, lang = 'en-US') => {
          try {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(String(text));
            u.lang = 'en-US';
            u.rate = 0.85;
            speechSynthesis.speak(u);
            return true;
          } catch { return false; }
        };
      })();

    const p = Store.profile();
    document.getElementById('who').textContent = `${Store.profileEmoji(p)} ${p}`;
    const s = Store.load('flags');
    let rescueView = false;
    if (!Store.syncEnabled() && p !== 'Arjun') {
      try {
        const arjun = JSON.parse(localStorage.getItem('games.Arjun.flags') || 'null');
        if (arjun && arjun.totals && arjun.totals.plays > 0) { rescueView = true; }
      } catch {}
    }

    const p = Store.profile();
    document.getElementById('who').textContent = `${Store.profileEmoji(p)} ${p}`;
    const s = Store.load('flags');
    let rescueView = false;
    if (!Store.syncEnabled() && p !== 'Arjun') {
      try {
        const arjun = JSON.parse(localStorage.getItem('games.Arjun.flags') || 'null');
        if (arjun && arjun.totals && arjun.totals.plays > 0) { rescueView = true; }
      } catch {}

    const st = (typeof stats === 'function' ? stats : (() => ({ seen: 0, ranks: { sprout: 0, rising: 0, sharp: 0, champion: 0 }, byRegion: {}, weak: [], due: 0 }))(Store.load('flags').srs);
    const el = document.getElementById('content');
    const rescueBanner = ''
      ? '<div class="card" style="margin-bottom:1.1rem;background:var(--verdict-bg);border:2px solid var(--verdict-border)"><b>📖 Showing Arjun\'s games saved on this device.</b> Sign in from the hub (tap 👑 Arjun) to sync them everywhere.</div>'
      : '';

    if (typeof stats === 'function') {
      const st = stats(Store.load('flags').srs);
      const mastered = (st.ranks?.sharp || 0) + (st.ranks?.champion || 0);
      const masterPct = Math.round(100 * (st.ranks?.sharp + st.ranks?.champion || 0) / WORLD_COUNT);
      const regions = (REGIONS || []).map((r) => {
        const x = (st && st.byRegion ? st.byRegion[r] : { attempts: 0, correct: 0 });
        return { r, pct: x.attempts ? Math.round(100 * x.correct / x.attempts) : 0, empty: !x.attempts };
      }).sort((a, b) => b.pct - a.pct);
      const weakestRegion = regions.filter((x) => !x.empty).slice(-1)[0];
      let guestNote = !Store.syncEnabled()
        ? '<div style="margin-top:.7rem;font-weight:700">You\'re playing as <b>Guest</b> — scores save on this device only.<br/>Sign in as Arjun from the hub to keep them everywhere.</div>'
        : '';
      const el = document.getElementById('content');
      if (st && st.seen === 0) {
        el.innerHTML = '<div class="card"><div class="empty">No quizzes yet — play your first one and this page fills up! 🌱</div></div>';
      } else {
        const mastered = (st.ranks?.sharp || 0) + (st.ranks?.champion || 0);
        const masterPct = Math.round(100 * ((st.ranks?.sharp || 0) + (st.ranks?.champion || 0)) / WORLD_COUNT);
        const regions = REGIONS.map((r) => {
          const x = (st && st.byRegion ? st.byRegion[r] : { attempts: 0, correct: 0 });
          return { r, pct: x.attempts ? Math.round(100 * x.correct / x.attempts) : 0, empty: !x.attempts };
        }).sort((a, b) => b.pct - a.pct);
        const weakestRegion = regions.filter((x) => !x.empty).slice(-1)[0];
        document.getElementById('content').innerHTML = `
          <div class="card" style="margin-bottom:1.1rem">
            <div class="big"><span class="pct">${masterPct}%</span><span class="lbl">mastered · ${mastered} of ${WORLD_COUNT} flags</span></div>
            <div class="bar"><i style="width:${Math.round(100 * mastered / WORLD_COUNT)}%"></i></div>
            <div class="meta" style="text-align:center">${st.seen} flags seen · ${st.due} due for review</div>
            <div style="font-weight:900;margin:.8rem 0 .2rem">By region</div>
            ${regions.map((x) => `
              <div class="rg"><span class="nm">${GLOBE[x.r] || '🌍'} ${x.r}${weakestRegion && x.r === weakestRegion.r && !x.empty ? ' 👀' : ''}</span>
              <div class="bar"><i style="width:${x.pct}%"></i></div><span class="pc">${x.empty ? '—' : x.pct + '%'}</span></div>`).join('')}
        <div class="card" style="margin-bottom:1.1rem">
          <div style="font-weight:900;margin-bottom:.5rem">Mastery ranks</div>
          <div class="ranks">
            ${Object.entries(RANK_LABELS || {}).map(([k, lbl]) => `<span class="rank">${lbl} · ${st.ranks?.[k] || 0}</span>`).join('')}
          </div>
        </div>
        ${st.weak?.length ? `
        <div class="card" style="margin-bottom:1.1rem">
          <div style="font-weight:900;margin-bottom:.6rem">Your tricky ones 👀</div>
          <div class="weakgrid">
            ${st.weak.map((x) => `
              <div class="mini">
                <img src="img/${x.code}.svg" alt="" draggable="false"/>
                <div class="nm">${esc(codeNames[x.code] || x.code.toUpperCase())}</div>
                <div class="acc">${x.e.correct}/${x.e.attempts} · box ${x.e.box}</div>
                <button type="button" class="speak" data-speak="${esc(codeNames[x.code] || '')}" aria-label="Hear ${esc(codeNames[x.code] || '')}">🔊</button>
              </div>`).join('')}
          </div>` : ''}
        ${st.plays ? `
        <div class="card">
          <div style="font-weight:900;margin-bottom:.6rem">⏱ Recent quizzes</div>
          ${s.sessions.slice(-5).reverse().map((ses) => `
            <div class="hrow">
              <span class="when">${new Date(ses.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} · ${ses.n} flags${ses.cfg && ses.cfg.focus === 'Weak' ? ' · weak drill' : ''}</span>
              <span class="res">${ses.score} ⭐ · ${Math.round(100 * ses.correct / ses.n)}%</span>
            </div>`).join('')}
        </div>` : ''}`;
    }
    document.addEventListener('click', (e) => {
      if (e.target.closest && e.target.closest('[data-theme-toggle]')) cycleTheme();
      if (e.target.closest && e.target.closest('[data-speak]')) speak(e.target.dataset.speak, 'en-US');
    });
    if (rescueView) {
      const cta = document.getElementById('drillCta');
      if (cta) cta.innerHTML = '<a class="btn" href="../">👑 Sign in as Arjun to sync & drill</a>';
    }
    window.__statsLoaded = true;
  </script>
</body>
</html>
