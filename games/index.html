<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffe29a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2b2118" media="(prefers-color-scheme: dark)" />
  <title>The Play Room — Games &amp; Quizzes</title>
  <script>(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}document.documentElement.dataset.theme=t})();</script>
  <link rel="stylesheet" href="assets/css/base.css?v=09072315" />
  <style>
    .flagrow { display: flex; gap: .55rem; margin: .2rem 0; }
    .flagrow img { width: 3.4rem; height: auto; border-radius: .45rem; box-shadow: 0 3px 8px var(--shadow-soft); animation: float 3s ease-in-out infinite; }
    .flagrow img:nth-child(2) { animation-delay: .35s; }
    .flagrow img:nth-child(3) { animation-delay: .7s; }
    .flagrow img:nth-child(4) { animation-delay: 1.05s; }
    .herotop { display: flex; align-items: center; gap: .8rem; }
    .cardlink { text-decoration: none; color: inherit; display: block; }
    .pbar { display: flex; gap: .4rem; align-items: center; overflow-x: auto; flex: 1 1 auto; min-width: 0; padding-bottom: .2rem; -webkit-overflow-scrolling: touch; }
    .pbar::-webkit-scrollbar { display: none; }
    .pbar .chip { white-space: nowrap; flex-shrink: 0; font-size: .85rem; padding: .45rem .85rem; }
    .emojigrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; margin: .7rem 0 1rem; }
    .emojigrid button {
      font-size: 1.7rem; padding: .55rem 0; border-radius: 1rem; border: 3px solid transparent;
      background: var(--flag-card); cursor: pointer; font-family: inherit; box-shadow: 0 3px 0 var(--answer-shadow);
    }
    .emojigrid button.on { border-color: var(--accent); background: var(--card-soft); }
    .prow { display: flex; align-items: center; justify-content: space-between; gap: .6rem; background: var(--card); border-radius: 1rem; padding: .6rem .8rem; margin-bottom: .5rem; box-shadow: 0 3px 0 var(--answer-shadow); font-weight: 800; }
    .prow .del { border: none; background: var(--wrong-bg); color: var(--bad); border-radius: .7rem; padding: .35rem .7rem; font-weight: 900; cursor: pointer; font-family: inherit; font-size: .85rem; }
    .shake { animation: shakeX .4s ease; }
    @keyframes shakeX { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .merr { color: var(--bad); font-weight: 800; font-size: .9rem; min-height: 1.2rem; margin-bottom: .4rem; text-align: center; }
    h1.title { margin-top: .4rem; }
    .sub { margin-bottom: .8rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar tight">
      <a class="chip" href="../">🏠 arjun.hk</a>
      <div class="pbar" id="profiles"></div>
      <button class="chip" id="themeToggle" aria-label="Toggle light/dark theme" title="Light / dark">🌓</button>
    </div>
    <div id="status" style="text-align:center;font-weight:800;min-height:1.4rem;margin:.2rem 0 .5rem;font-size:.9rem"></div>
    <h1 class="title">The Play Room 🎮</h1>
    <div class="sub">Games &amp; quizzes — win dollarbucks!</div>
    <div class="statrow"><span class="chip" id="totals">⏱ 0 min · 💰 0 · 🎮 0</span></div>
    <div class="grid">
      <a class="cardlink" href="flags/">
        <div class="card hero">
          <div class="herotop">
            <span class="em">🚩</span>
            <div>
              <h2>Flags of the World</h2>
              <p>Guess the flag — beat your best!</p>
            </div>
          </div>
          <div class="flagrow">
            <img src="flags/img/fr.svg" alt="" draggable="false"/>
            <img src="flags/img/jp.svg" alt="" draggable="false"/>
            <img src="flags/img/br.svg" alt="" draggable="false"/>
            <img src="flags/img/ke.svg" alt="" draggable="false"/>
          </div>
          <div class="meta" id="flagsMeta"></div>
          <div class="herorow">
            <span class="btn">▶ Play</span>
          </div>
        </div>
      </a>
      <div class="card soon"><span class="em">🏛️</span><h3>World Capitals</h3><span class="pill">Soon</span></div>
      <div class="card soon"><span class="em">🔢</span><h3>Math Machine</h3><span class="pill">Soon</span></div>
      <div class="card soon"><span class="em">🐨</span><h3>Animal Kingdom</h3><span class="pill">Soon</span></div>
    </div>
    <footer>the caterpillar is watching you play 🐛</footer>
  </div>
  <script type="module">
    import { Store, EMOJIS, normalizeName, validNewProfile } from './assets/js/store.js?v=09072315';
    import { bindThemeToggle } from './assets/js/theme.js?v=09072315';

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const app = document.querySelector('.container');

    const persistentStatus = () => {
      if (Store.syncEnabled()) return '✅ Arjun is signed in — stats sync to every device.';
      try {
        const legacy = JSON.parse(localStorage.getItem('games.Arjun.flags'));
        if (Store.profile() === 'Guest' && legacy && legacy.totals && legacy.totals.plays > 0) {
          return '💾 You have saved games — tap 👑 Arjun and enter your PIN to sync them.';
        }
      } catch {}
      return '';
    };

    let toastTimer = null;
    const toast = (msg, ok = true) => {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.color = ok ? 'var(--good)' : 'var(--bad)';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.textContent = persistentStatus();
        el.style.color = 'var(--text-faint)';
      }, 4000);
    };

    const renderStatus = () => {
      const el = document.getElementById('status');
      el.textContent = persistentStatus();
      el.style.color = 'var(--text-faint)';
    };

    const renderProfiles = () => {
      const cur = Store.profile();
      const synced = Store.syncEnabled();
      const chips = [
        `<button type="button" class="chip ${cur === 'Arjun' ? 'on' : 'ghost'}" data-p="Arjun">${synced ? '👑 Arjun' : '👑 Arjun 🔒'}</button>`,
        `<button type="button" class="chip ${cur === 'Guest' ? 'on' : 'ghost'}" data-p="Guest">👤 Guest</button>`,
        ...Store.profiles().map((p) =>
          `<button type="button" class="chip ${cur === p.name ? 'on' : 'ghost'}" data-p="${esc(p.name)}">${esc(p.emoji)} ${esc(p.name)}</button>`),
        '<button type="button" class="chip ghost" data-new="1">➕ New</button>',
      ];
      if (Store.profiles().length) chips.push('<button type="button" class="chip ghost" data-manage="1">✏️</button>');
      if (synced) chips.push('<button type="button" class="chip ghost" data-signout="1">Sign out</button>');
      document.getElementById('profiles').innerHTML = chips.join('');
    };

    const render = () => {
      renderProfiles();
      const s = Store.load('flags').totals;
      document.getElementById('totals').textContent =
        `⏱ ${Math.round(s.timeMs / 60000)} min · 💰 ${s.score} · 🎮 ${s.plays}`;
      document.getElementById('flagsMeta').textContent =
        s.seen ? `Best score ${s.best} · ${Math.round(100 * s.correct / s.seen)}% correct so far` : '250 flags · smart drills · beat your best';
      renderStatus();
    };

    const closeModal = () => { const m = app.querySelector('.overlay'); if (m) m.remove(); };
    const openModal = (html) => {
      closeModal();
      const ov = document.createElement('div');
      ov.className = 'overlay';
      ov.innerHTML = `<div class="overlay-card">${html}</div>`;
      app.appendChild(ov);
      return ov;
    };

    const openCreate = () => {
      let emoji = EMOJIS[0];
      const ov = openModal(`
        <h2 style="font-weight:900;font-size:1.3rem;margin-bottom:.2rem">Who's playing?</h2>
        <div style="font-size:.9rem;font-weight:700;color:#9a6b3f;margin-bottom:.8rem">Pick a name and a buddy</div>
        <input class="field" id="pname" maxlength="12" placeholder="Name…" autocomplete="off" autocapitalize="words" style="text-align:center"/>
        <div class="emojigrid">${EMOJIS.map((e, i) => `<button type="button" data-e="${e}" class="${i === 0 ? 'on' : ''}">${e}</button>`).join('')}</div>
        <div class="merr" id="perr"></div>
        <div class="row">
          <button class="btn alt" data-cancel="1">Cancel</button>
          <button class="btn" data-create="1">Create ✓</button>
        </div>`);
      ov.querySelector('.emojigrid').addEventListener('click', (e) => {
        const b = e.target.closest('[data-e]');
        if (!b) return;
        emoji = b.dataset.e;
        ov.querySelectorAll('.emojigrid button').forEach((x) => x.classList.toggle('on', x === b));
      });
      ov.querySelector('[data-cancel]').addEventListener('click', closeModal);
      const create = () => {
        const name = normalizeName(ov.querySelector('#pname').value);
        const err = validNewProfile(name, Store.profiles().map((p) => p.name));
        if (err) {
          const er = ov.querySelector('#perr');
          er.textContent = err;
          ov.querySelector('#pname').classList.add('shake');
          setTimeout(() => ov.querySelector('#pname').classList.remove('shake'), 450);
          return;
        }
        Store.addProfile(name, emoji);
        Store.setProfile(name);
        closeModal();
        toast(`Welcome, ${name}! ${Store.profileEmoji(name)}`);
        render();
      };
      ov.querySelector('[data-create]').addEventListener('click', create);
      ov.querySelector('#pname').addEventListener('keydown', (e) => { if (e.key === 'Enter') create(); });
      setTimeout(() => ov.querySelector('#pname').focus({ preventScroll: true }), 50);
    };

    const openPin = () => {
      const ov = openModal(`
        <h2 style="font-weight:900;font-size:1.3rem;margin-bottom:.2rem">👑 Arjun only</h2>
        <div style="font-size:.9rem;font-weight:700;color:#9a6b3f;margin-bottom:.8rem">Enter the PIN to play as Arjun and sync stats</div>
        <input class="field" id="pin" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="••••" style="text-align:center;letter-spacing:.5em;font-size:1.6rem"/>
        <div class="merr" id="perr"></div>
        <div class="row">
          <button class="btn alt" data-cancel="1">Cancel</button>
          <button class="btn" data-go="1">Sign in ✓</button>
        </div>`);
      ov.querySelector('[data-cancel]').addEventListener('click', closeModal);
      const go = async () => {
        const pin = ov.querySelector('#pin').value.replace(/[^0-9]/g, '');
        const er = ov.querySelector('#perr');
        if (!pin) { er.textContent = 'Type the PIN'; return; }
        let ok = false;
        try { ok = await Store.login(pin); } catch { closeModal(); toast('Cloud unreachable — try again later', false); return; }
        if (!ok) {
          er.textContent = 'Wrong PIN — you stay as Guest';
          ov.querySelector('#pin').classList.add('shake');
          setTimeout(() => ov.querySelector('#pin').classList.remove('shake'), 450);
          return;
        }
        Store.setProfile('Arjun');
        closeModal();
        try {
          await Store.pull('flags');
          toast('Signed in — stats synced ✓');
        } catch {
          toast('Signed in (cloud busy — will retry)', false);
        }
        render();
      };
      ov.querySelector('[data-go]').addEventListener('click', go);
      ov.querySelector('#pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      setTimeout(() => ov.querySelector('#pin').focus({ preventScroll: true }), 50);
    };

    const openManage = () => {
      const list = () => Store.profiles().map((p) => `
        <div class="prow"><span>${esc(p.emoji)} ${esc(p.name)}</span>
        <button class="del" data-del="${esc(p.name)}">🗑 Delete</button></div>`).join('');
      const ov = openModal(`
        <h2 style="font-weight:900;font-size:1.2rem;margin-bottom:.7rem">Manage profiles</h2>
        <div id="mlist">${list()}</div>
        <div style="font-size:.8rem;color:#5a3a1a99;font-weight:700;margin:.4rem 0 .8rem">Deleting a profile removes its scores from this device. Arjun and Guest can't be deleted.</div>
        <button class="btn alt" style="width:100%" data-cancel="1">Done</button>`);
      ov.querySelector('[data-cancel]').addEventListener('click', closeModal);
      ov.querySelector('#mlist').addEventListener('click', (e) => {
        const b = e.target.closest('[data-del]');
        if (!b) return;
        if (b.dataset.sure !== '1') {
          b.dataset.sure = '1';
          b.textContent = 'Sure?';
          return;
        }
        Store.removeProfile(b.dataset.del);
        ov.querySelector('#mlist').innerHTML = list();
        render();
      });
    };

    document.getElementById('profiles').addEventListener('click', async (e) => {
      if (e.target.closest('[data-new]')) { openCreate(); return; }
      if (e.target.closest('[data-manage]')) { openManage(); return; }
      if (e.target.closest('[data-signout]')) {
        Store.setToken('');
        Store.setProfile('Guest');
        toast('Signed out — playing as Guest');
        render();
        return;
      }
      const b = e.target.closest('[data-p]');
      if (!b) return;
      const name = b.dataset.p;
      if (name === 'Arjun') {
        if (Store.syncEnabled()) return;
        openPin();
        return;
      }
      Store.setProfile(name);
      toast(`${Store.profileEmoji(name)} Now playing as ${name}`);
      render();
    });

    if (Store.syncEnabled()) Store.pull('flags').then(render).catch(() => {});
    bindThemeToggle(document.getElementById('themeToggle'));
    render();
  </script>
</body>
</html>
