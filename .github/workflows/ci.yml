name: CI

# Shared CI baseline: runs on PR + push to main. Static nginx site.
# Maturity tier: basic (HTML presence + well-formedness). No design/build pages / eslint here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -s index.html && echo "index.html present and non-empty"
          grep -q "</html>" index.html && echo "html closes properly"
          # ensure referenced images exist (no broken local assets)
          for img in $(grep -oE 'src="[^"]+\.(png|jpg|jpeg|svg|webp)"' index.html | sed -E 's/.*src="([^"]+)"/\1/' | sort -u); do
            test -f "$img" || { echo "MISSING asset: $img"; exit 1; }
          done
          echo "static validation OK"