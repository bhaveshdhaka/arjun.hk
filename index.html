<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffe29a" />
  <title>Baby Boy's Restaurant — Menu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #ffe29a 0%, #ffb3c1 55%, #b2e0ff 100%);
      color: #5a3a1a;
      min-height: 100vh; min-height: 100dvh;
      padding: calc(1.5rem + env(safe-area-inset-top)) 1rem calc(2rem + env(safe-area-inset-bottom));
      overflow-x: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 {
      font-size: clamp(2.4rem, 10vw, 4.5rem);
      font-weight: 900;
      text-shadow: 0 3px 0 #fff8, 0 0 24px #ffffffaa;
      letter-spacing: -0.02em;
      line-height: 1.05;
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .badge {
      display: inline-block;
      font-size: clamp(1.2rem, 5vw, 1.8rem);
      font-weight: 900;
      color: #fff;
      background: linear-gradient(180deg, #ff8f5e, #ff5e7e);
      border-radius: 999px;
      padding: .5rem 1.8rem;
      margin-top: 1rem;
      box-shadow: 0 6px 0 #c9355a, 0 12px 24px #ff5e7e55;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: #ffffffdd;
      border-radius: 2rem;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 8px 24px #00000022, 0 4px 0 #ffffff88;
      transition: transform .2s ease, box-shadow .2s ease;
      animation: card-in .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .card:nth-child(1) { animation-delay: .1s; }
    .card:nth-child(2) { animation-delay: .2s; }
    .card:nth-child(3) { animation-delay: .3s; }
    .card:nth-child(4) { animation-delay: .4s; }
    .card:nth-child(5) { animation-delay: .5s; }
    @keyframes card-in { 0% { transform: translateY(40px) scale(.9); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    .card:active { transform: scale(.97); box-shadow: 0 4px 12px #00000022; }
    .card-img {
      width: 100%;
      max-width: 200px;
      height: auto;
      margin: 0 auto 1rem;
      display: block;
      border-radius: 1rem;
      background: #fff;
      padding: .5rem;
      box-shadow: inset 0 2px 8px #00000010;
      animation: float 3s ease-in-out infinite;
    }
    .card:nth-child(2) .card-img { animation-delay: .3s; }
    .card:nth-child(3) .card-img { animation-delay: .6s; }
    .card:nth-child(4) .card-img { animation-delay: .9s; }
    .card:nth-child(5) .card-img { animation-delay: 1.2s; }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
    .card-name {
      font-size: clamp(1.4rem, 6vw, 2rem);
      font-weight: 900;
      color: #5a3a1a;
      margin-bottom: .5rem;
    }
    .card-price {
      font-size: clamp(1.2rem, 5vw, 1.6rem);
      font-weight: 800;
      color: #ff5e7e;
      background: #fff0f5;
      border-radius: 999px;
      padding: .3rem 1rem;
      display: inline-block;
    }
    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: clamp(1rem, 4vw, 1.3rem);
      font-weight: 700;
      color: #7c4a2a;
      opacity: .8;
    }
    @media (max-width: 480px) {
      .menu { grid-template-columns: 1fr; }
    }
    @media (min-width: 481px) and (max-width: 768px) {
      .menu { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 769px) {
      .menu { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Baby Boy's<br />Restaurant</h1>
      <div class="badge">Now Open! 🎉</div>
    </header>
    <div class="menu">
      <div class="card">
        <img class="card-img" src="images/cheese.png" alt="Cheese plate with grapes" />
        <div class="card-name">Cheese</div>
        <div class="card-price">$13 dollarbucks</div>
      </div>
      <div class="card">
        <img class="card-img" src="images/matcha.png" alt="Matcha latte with heart" />
        <div class="card-name">Matcha</div>
        <div class="card-price">$16 dollarbucks</div>
      </div>
      <div class="card">
        <img class="card-img" src="images/bagel.png" alt="Bagel with cream cheese" />
        <div class="card-name">Bagel</div>
        <div class="card-price">$20 dollarbucks</div>
      </div>
      <div class="card">
        <img class="card-img" src="images/cream.png" alt="Cream tub with knife" />
        <div class="card-name">Cream</div>
        <div class="card-price">$19 dollarbucks</div>
      </div>
      <div class="card">
        <img class="card-img" src="images/icecream.png" alt="Chocolate ice cream cone" />
        <div class="card-name">Ice-Cream</div>
        <div class="card-price">$18 dollarbucks</div>
      </div>
    </div>
    <footer> Come feed the caterpillar after lunch! 🐛</footer>
  </div>
</body>
</html>
