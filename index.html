<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffe29a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2b2118" media="(prefers-color-scheme: dark)" />
  <title>Baby Boy's Restaurant — Menu</title>
  <script>(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}document.documentElement.dataset.theme=t})();</script>
  <style>
    :root {
      color-scheme: light;
      --bg-1: #ffe29a; --bg-2: #ffb3c1; --bg-3: #b2e0ff;
      --text: #5a3a1a; --text-soft: #7c4a2a;
      --card: #ffffffdd; --card-soft: #fff0f5; --card-warm: #fff8e8;
      --chip-bg: #ffffffdd; --chip-shadow: #ffe1ec;
      --btn-grad-a: #ff8f5e; --btn-grad-b: #ff5e7e; --btn-shadow: #c9355a;
      --shadow-soft: #00000022; --shadow-lift: #ffffff88; --shadow-deep: #00000018;
      --flag-card: #ffffff;
      --title-shadow: #fff8;
      --accent: #ff5e7e;
      --price-bg: #fff0f5;
      --toggle-bg: #ffffffdd; --toggle-shadow: #ffe1ec;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg-1: #2b2118; --bg-2: #3a2333; --bg-3: #1f2430;
      --text: #f6ead9; --text-soft: #e0c9a8;
      --card: #322a24f2; --card-soft: #4a3038; --card-warm: #3d3327;
      --chip-bg: #3a3128ee; --chip-shadow: #241d18;
      --btn-shadow: #8f2340;
      --shadow-soft: #00000066; --shadow-lift: #ffffff14; --shadow-deep: #00000045;
      --title-shadow: #00000040;
      --price-bg: #4a3038;
      --toggle-bg: #3a3128ee; --toggle-shadow: #241d18;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      color: var(--text);
      min-height: 100vh; min-height: 100dvh;
      padding: calc(1.5rem + env(safe-area-inset-top)) 1rem calc(2rem + env(safe-area-inset-bottom));
      overflow-x: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 {
      font-size: clamp(2.4rem, 10vw, 4.5rem);
      font-weight: 900;
      text-shadow: 0 3px 0 var(--title-shadow), 0 0 24px #ffffff55;
      letter-spacing: -0.02em;
      line-height: 1.05;
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .badge {
      display: inline-block;
      font-size: clamp(1.2rem, 5vw, 1.8rem);
      font-weight: 900;
      color: #fff;
      background: linear-gradient(180deg, #ff8f5e, #ff5e7e);
      border-radius: 999px;
      padding: .5rem 1.8rem;
      margin-top: 1rem;
      box-shadow: 0 6px 0 var(--btn-shadow), 0 12px 24px color-mix(in srgb, var(--btn-grad-b) 33%, transparent);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card);
      border-radius: 2rem;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 8px 24px var(--shadow-soft), 0 4px 0 var(--shadow-lift);
      transition: transform .2s ease, box-shadow .2s ease;
      animation: card-in .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .card:nth-child(1) { animation-delay: .1s; }
    .card:nth-child(2) { animation-delay: .2s; }
    .card:nth-child(3) { animation-delay: .3s; }
    .card:nth-child(4) { animation-delay: .4s; }
    .card:nth-child(5) { animation-delay: .5s; }
    @keyframes card-in { 0% { transform: translateY(40px) scale(.9); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    .card:active { transform: scale(.97); box-shadow: 0 4px 12px #00000022; }
    .card-img {
      width: 100%;
      max-width: 200px;
      height: auto;
      margin: 0 auto 1rem;
      display: block;
      border-radius: 1rem;
      background: #fff;
      padding: .5rem;
      box-shadow: inset 0 2px 8px var(--shadow-soft);
      animation: float 3s ease-in-out infinite;
    }
    .card:nth-child(2) .card-img { animation-delay: .3s; }
    .card:nth-child(3) .card-img { animation-delay: .6s; }
    .card:nth-child(4) .card-img { animation-delay: .9s; }
    .card:nth-child(5) .card-img { animation-delay: 1.2s; }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
    .card-name {
      font-size: clamp(1.4rem, 6vw, 2rem);
      font-weight: 900;
      color: var(--text);
      margin-bottom: .5rem;
    }
    .card-price {
      font-size: clamp(1.2rem, 5vw, 1.6rem);
      font-weight: 800;
      color: var(--accent);
      background: var(--price-bg);
      border-radius: 999px;
      padding: .3rem 1rem;
      display: inline-block;
    }
    .pay {
      background: var(--card);
      border-radius: 2rem;
      padding: 1.5rem;
      margin-top: 1.5rem;
      text-align: center;
      box-shadow: 0 8px 24px var(--shadow-soft), 0 4px 0 var(--shadow-lift);
      animation: card-in .5s cubic-bezier(.34,1.56,.64,1) both;
      animation-delay: .6s;
    }
    .pay-title {
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      font-weight: 900;
      color: var(--text);
      margin-bottom: 1rem;
    }
    .pay-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .6rem;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      font-size: clamp(.95rem, 3.5vw, 1.15rem);
      font-weight: 800;
      color: var(--text);
      background: var(--price-bg);
      border-radius: 999px;
      padding: .4rem 1rem;
      box-shadow: 0 3px 0 #ffe1ec;
      transition: transform .2s ease;
    }
    .chip:active { transform: scale(.95); }
    .chip svg { width: 1.3em; height: 1.3em; flex-shrink: 0; }
    .games-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      text-decoration: none;
      font-size: clamp(1.1rem, 4.5vw, 1.5rem);
      font-weight: 900;
      color: #fff;
      background: linear-gradient(180deg, #ff8f5e, #ff5e7e);
      border-radius: 999px;
      padding: 1rem 1.5rem;
      margin-top: 1.5rem;
      box-shadow: 0 6px 0 var(--btn-shadow), 0 12px 24px color-mix(in srgb, var(--btn-grad-b) 33%, transparent);
      animation: card-in .5s cubic-bezier(.34,1.56,.64,1) both;
      animation-delay: .7s;
    }
    .games-link:active { transform: translateY(3px); box-shadow: 0 3px 0 #c9355a; }
    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: clamp(1rem, 4vw, 1.3rem);
      font-weight: 700;
      color: var(--text-soft);
      opacity: .8;
    }
    @media (max-width: 480px) {
      .menu { grid-template-columns: 1fr; }
    }
    @media (min-width: 481px) and (max-width: 768px) {
      .menu { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 769px) {
      .menu { grid-template-columns: repeat(3, 1fr); }
    }
    /* ---- online menu additions ---- */
    .menu-section { margin-bottom: 1.2rem; }
    .menu-section .sec-head, .menu.fixed .sec-head { border: none; }
    .sec-head {
      display: flex; align-items: center; gap: .6rem; width: 100%;
      justify-content: space-between; text-align: left; cursor: pointer;
      font-family: inherit; color: var(--text);
      background: var(--chip-bg); border-radius: 1.2rem; padding: .8rem 1.2rem;
      box-shadow: 0 4px 0 var(--chip-shadow), 0 2px 10px var(--shadow-soft);
      border: none;
    }
    .menu-section.now .sec-head { background: linear-gradient(180deg, #ff8f5e, #ff5e7e); color: #fff; }
    .menu-section.now .sec-head .sec-hours { color: #fff; opacity: .9; }
    .sec-title { font-size: clamp(1.15rem, 4.5vw, 1.5rem); font-weight: 900; display: inline-flex; align-items: center; gap: .5rem; }
    .nowbadge {
      font-size: .75rem; font-weight: 900; text-transform: uppercase; letter-spacing: .06em;
      background: #ffffff33; border-radius: 999px; padding: .15rem .55rem;
    }
    .sec-hours { font-size: .85rem; font-weight: 700; color: var(--text-soft); margin-left: auto; }
    .sec-chev { font-weight: 900; opacity: .7; }
    .sec-head[aria-expanded="true"] .sec-chev { transform: rotate(180deg); }
    .sec-body { padding: .8rem .2rem .2rem; }
    .menu-section.other .sec-body { opacity: .92; }
    .card-desc { font-size: .95rem; font-weight: 700; color: var(--text-soft); margin-bottom: .4rem; }
    .card-emoji { font-size: clamp(3.2rem, 18vw, 4.6rem); line-height: 1.25; margin: .6rem auto .9rem; display:block; width:max-content;max-width:100%; }
    .card.off { opacity: .55; filter: saturate(.6); }
    .soldoutbadge {
      font-weight: 900; color: var(--text-soft); background: var(--price-bg);
      border-radius: 999px; padding: .55rem 1.1rem; display: inline-block; margin-top: .2rem;
    }
    .addbtn, .bigbtn, .paychip, .tablechip, .stepbtn, .tab {
      font-family: inherit; font-weight: 900; border: none; cursor: pointer;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .addbtn {
      font-size: 1.05rem; color: #fff;
      background: linear-gradient(180deg, #ff8f5e, #ff5e7e);
      border-radius: 999px; padding: .6rem 1.4rem; margin-top: .5rem; min-height: 44px;
      box-shadow: 0 4px 0 var(--btn-shadow);
    }
    .addbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--btn-shadow); }
    .addbtn.hot { animation: none; }
    .emptynote { font-weight: 700; color: var(--text-soft); padding: .8rem 1rem; text-align: center; }
    .emptynote.warn { color: #a33; }
    /* table + cart floating controls */
    .tablebar, .cartpill {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
      border: none; cursor: pointer; font-family: inherit;
      font-size: clamp(.95rem, 3.8vw, 1.1rem); font-weight: 900; color: var(--text);
      background: var(--chip-bg); border-radius: 999px;
      box-shadow: 0 4px 0 var(--toggle-shadow), 0 10px 24px var(--shadow-soft);
      padding: .75rem 1.3rem; min-height: 3rem;
      -webkit-tap-highlight-color: transparent;
    }
    .tablebar { bottom: calc(1rem + env(safe-area-inset-bottom)); }
    .cartpill { bottom: calc(1rem + env(safe-area-inset-bottom) + 4.4rem); display: none; background: linear-gradient(180deg, #ff8f5e, #ff5e7e); color: #fff; box-shadow: 0 4px 0 var(--btn-shadow), 0 10px 24px var(--shadow-soft); }
    .cartpill:not(:empty) { display: block; }
    .overlay {
      position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center;
      background: #00000055; backdrop-filter: blur(2px); padding: 1rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    }
    .ov-card, .sheet {
      width: 100%; max-width: 560px; max-height: 78dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
      background: var(--card); backdrop-filter: blur(6px); color: var(--text);
      border-radius: 2rem; padding: 1.3rem 1.2rem;
      box-shadow: 0 12px 40px var(--shadow-soft), 0 4px 0 var(--shadow-lift);
      margin-bottom: calc(.5rem + env(safe-area-inset-bottom));
    }
    .ov-card { max-height: 70dvh; }
    .ov-head, .sh-head { font-size: clamp(1.25rem, 5vw, 1.6rem); font-weight: 900; margin-bottom: .8rem; text-align: center; }
    .tablegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(3rem, 1fr)); gap: .5rem; margin-bottom: 1rem; }
    .tablechip {
      min-height: 3rem; border-radius: 1rem; font-size: 1.15rem; color: var(--text);
      background: var(--price-bg); box-shadow: 0 3px 0 var(--chip-shadow);
    }
    .tablechip.sel { background: linear-gradient(180deg, #ff8f5e, #ff5e7e); color: #fff; box-shadow: 0 3px 0 var(--btn-shadow); }
    .sh-body.center { text-align: center; }
    .sentcard { background: var(--card-soft); border-radius: 1.4rem; padding: 1rem; display: grid; gap: .35rem; font-weight: 800; margin-bottom: .8rem; }
    .cartline {
      display: flex; align-items: center; gap: .5rem; padding: .55rem 0;
      border-bottom: 2px dashed color-mix(in srgb, var(--text-soft) 25%, transparent);
      font-weight: 800;
    }
    .cl-emoji { width: 1.8rem; text-align: center; }
    .cl-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cl-qty { display: inline-flex; align-items: center; gap: .55rem; }
    .cl-qty b { min-width: 1.4ch; text-align: center; }
    .cl-price { min-width: 3.2ch; text-align: right; }
    .stepbtn {
      min-width: 2.6rem; min-height: 2.6rem; border-radius: .9rem; font-size: 1.15rem;
      background: var(--price-bg); color: var(--text); box-shadow: 0 3px 0 var(--chip-shadow);
    }
    .stepbtn.rm { background: transparent; box-shadow: none; color: var(--text-soft); }
    .totrow { display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 1.15rem; padding: .7rem .2rem; }
    .notefield {
      width: 100%; font-family: inherit; font-size: 1rem; font-weight: 600; color: var(--text);
      background: var(--card-warm); border: 2px solid transparent; border-radius: 1.2rem;
      padding: .7rem .9rem; margin-top: .8rem; resize: none;
    }
    .notefield:focus { outline: none; border-color: var(--accent); }
    .notecount { font-size: .78rem; font-weight: 700; color: var(--text-soft); text-align: right; padding-right: .3rem; }
    .payrow { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; }
    .paychip {
      font-size: .95rem; color: var(--text); background: var(--price-bg);
      border-radius: 999px; padding: .55rem 1rem; min-height: 2.8rem;
      box-shadow: 0 3px 0 var(--chip-shadow);
    }
    .paychip.sel { background: linear-gradient(180deg, #ff8f5e, #ff5e7e); color: #fff; box-shadow: 0 3px 0 var(--btn-shadow); }
    .bigbtn {
      width: 100%; font-size: 1.15rem; color: #fff; padding: .95rem 1rem; min-height: 3.2rem;
      background: linear-gradient(180deg, #ff8f5e, #ff5e7e); border-radius: 999px;
      box-shadow: 0 5px 0 var(--btn-shadow); margin-top: .4rem;
    }
    .bigbtn:disabled { opacity: .45; box-shadow: none; cursor: default; }
    .bigbtn:not(:disabled):active { transform: translateY(2px); box-shadow: 0 3px 0 var(--btn-shadow); }
    .sh-aux {
      display: block; width: 100%; margin-top: .6rem; padding: .7rem;
      font-family: inherit; font-weight: 800; color: var(--text-soft);
      background: none; border: none; cursor: pointer; touch-action: manipulation;
    }
    @media (max-width: 480px) {
      .tablebar, .cartpill { max-width: 92vw; }
    }

  </style>
</head>
<body>
  <button id="themeToggle" aria-label="Toggle light/dark theme" title="Light / dark" style="position:fixed;top:calc(.7rem + env(safe-area-inset-top));right:.7rem;z-index:20;font-size:1.15rem;line-height:1;width:2.6rem;height:2.6rem;border:none;border-radius:50%;background:var(--toggle-bg);box-shadow:0 3px 0 var(--toggle-shadow);cursor:pointer;-webkit-tap-highlight-color:transparent">🌓</button>
  <div class="container">
    <header>
      <h1>Baby Boy's<br />Restaurant</h1>
      <div class="badge">Now Open! 🎉</div>
    </header>
    <div class="menu" id="menuRoot"></div>
    <div class="pay">
      <div class="pay-title">We accept dollarbucks 💳</div>
      <div class="pay-row">
        <span class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ff5e7e" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M6.8 9.2a4 4 0 0 1 0 5.6" />
            <path d="M9.9 7a8.5 8.5 0 0 1 0 10" />
            <path d="M13 4.9a13 13 0 0 1 0 14.2" />
            <path d="M16.1 2.8a17.5 17.5 0 0 1 0 18.4" />
          </svg>
          Tap / NFC
        </span>
        <span class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" aria-hidden="true">
            <path d="M12 3.4a8.6 8.6 0 0 1 8.6 8.6" stroke="#f58220" />
            <path d="M20.6 12a8.6 8.6 0 0 1 -8.6 8.6" stroke="#0072bc" />
            <path d="M12 20.6a8.6 8.6 0 0 1 -8.6 -8.6" stroke="#f58220" />
            <path d="M3.4 12a8.6 8.6 0 0 1 8.6 -8.6" stroke="#0072bc" />
            <circle cx="12" cy="12" r="2.6" fill="#e87722" stroke="none" />
          </svg>
          Octopus
        </span>
        <span class="chip">
          <svg viewBox="0 0 44 24" aria-hidden="true">
            <text x="22" y="17.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" font-style="italic" letter-spacing="0.5" fill="#1a1f71">VISA</text>
          </svg>
          Visa
        </span>
        <span class="chip">
          <svg viewBox="0 0 36 24" aria-hidden="true">
            <circle cx="14" cy="12" r="8.5" fill="#eb001b" />
            <circle cx="22" cy="12" r="8.5" fill="#f79e1b" />
            <path d="M18 4.5a8.5 8.5 0 0 1 0 15a8.5 8.5 0 0 1 0 -15z" fill="#ff5f00" />
          </svg>
          Mastercard
        </span>
      </div>
    </div>
    <a class="games-link" href="games/">🎮 Play games in the Play Room →</a>
    <footer> Come feed the caterpillar after lunch! 🐛</footer>
  </div>

  <!-- online menu: mounts -->
  <button id="tableBar" class="tablebar" data-act="table" aria-haspopup="dialog" aria-label="Pick your table number"></button>
  <button id="cartPill" class="cartpill" data-act="cartbtn" aria-haspopup="dialog" aria-label="Open your order"></button>
  <div id="tableOverlay" class="overlay" hidden role="dialog" aria-label="Pick your table">
    <div class="ov-card">
      <div class="ov-head">🍽️ Which table are you?</div>
      <div id="tableGrid" class="tablegrid"></div>
      <button class="sh-aux" data-act="closetable">Close</button>
    </div>
  </div>
  <div id="orderSheet" class="sheet" hidden role="dialog" aria-label="Your order"></div>

  <script type="module">
    import { init } from './games/menu/js/menu.js?v=09250742';
    init();
  </script>

  <script>
    (function () {
      var b = document.getElementById('themeToggle');
      var paint = function () { b.textContent = (document.documentElement.dataset.theme === 'dark') ? '☀️' : '🌙'; };
      b.addEventListener('click', function () {
        var next = (document.documentElement.dataset.theme === 'dark') ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) { metas[i].removeAttribute('media'); metas[i].setAttribute('content', next === 'dark' ? '#2b2118' : '#ffe29a'); }
        paint();
      });
      paint();
    })();
  </script>
</body>
</html>
